config_a_name: "prompt_v1_concise"
config_b_name: "prompt_v2_grounded_cot"

cases:
  - id: "c01"
    input: "What is the time complexity of binary search on a sorted array of n elements?"
    system_prompt: "Answer accurately and concisely."
    expected_output: "O(log n) worst-case and average-case time complexity, and O(1) space iteratively."
    output_a: "O(log n)."
    output_b: "Binary search has O(log n) worst-case and average-case time complexity and O(1) iterative space complexity because it halves the search interval at each step."
    gold_winner: "B"

  - id: "c02"
    input: "Explain why SQLite uses WAL mode for concurrent reads."
    system_prompt: "Be factually grounded and concise."
    expected_output: "WAL (Write-Ahead Logging) allows readers to read from the main database file while a writer appends changes to the WAL file, enabling concurrent reads."
    output_a: "WAL mode makes SQLite faster."
    output_b: "Write-Ahead Logging (WAL) lets readers access the main database snapshot concurrently while a single writer appends new pages to the WAL file without blocking readers."
    gold_winner: "B"

  - id: "c03"
    input: "What is the default HTTP status code for a newly created resource in REST?"
    system_prompt: "Answer accurately."
    expected_output: "201 Created."
    output_a: "201 Created is returned when a POST request creates a new resource."
    output_b: "200 OK."
    gold_winner: "A"

  - id: "c04"
    input: "How do you prevent duplicate vectors during RAG re-ingestion?"
    system_prompt: "Be specific and accurate."
    expected_output: "Hash the document and chunks with SHA-256 and use content-addressed deterministic IDs with INSERT OR IGNORE or UPSERT."
    output_a: "You can delete the database and re-ingest everything."
    output_b: "Compute a SHA-256 hash per document and deterministic chunk IDs, then use INSERT OR IGNORE or UPSERT on conflict so unchanged chunks are skipped."
    gold_winner: "B"

  - id: "c05"
    input: "What does L2 normalization do to an embedding vector?"
    system_prompt: "Answer accurately."
    expected_output: "L2 normalization scales the vector to unit length (norm = 1) so cosine similarity equals the dot product."
    output_a: "L2 normalization scales a vector to unit length (norm = 1), making cosine similarity equivalent to the dot product."
    output_b: "It removes negative numbers from the embedding."
    gold_winner: "A"

  - id: "c06"
    input: "Define Mean Reciprocal Rank (MRR) in information retrieval."
    system_prompt: "Give a clear, accurate definition."
    expected_output: "MRR is the average of 1/rank of the first relevant result across all queries."
    output_a: "MRR measures how many relevant documents exist in total."
    output_b: "MRR averages 1/rank of the first relevant document across all queries, rewarding retrieval systems that surface relevant evidence near rank 1."
    gold_winner: "B"

  - id: "c07"
    input: "How much raw storage does 1M float32 vectors of 384 dimensions require?"
    system_prompt: "Show the exact calculation."
    expected_output: "1,000,000 * 384 * 4 bytes = 1,536,000,000 bytes (~1.43 GiB or 1.54 GB)."
    output_a: "Around 150 MB."
    output_b: "1,000,000 * 384 * 4 bytes equals 1,536,000,000 bytes (~1.54 GB or 1.43 GiB)."
    gold_winner: "B"

  - id: "c08"
    input: "What is the purpose of temperature=0.0 in an LLM-as-Judge call?"
    system_prompt: "Answer concisely."
    expected_output: "Setting temperature=0.0 makes decoding deterministic to reduce test-retest variance."
    output_a: "Temperature 0.0 reduces sampling randomness so judge verdicts are deterministic across re-runs."
    output_b: "Temperature 0.0 makes the model run 10x faster."
    gold_winner: "A"

  - id: "c09"
    input: "Why should an LLM judge come from a different model family than the generator?"
    system_prompt: "Answer accurately."
    expected_output: "To mitigate self-enhancement bias, where a model family favors its own stylistic patterns."
    output_a: "Using a different model family mitigates self-enhancement bias where a model favors its own phrasing and style."
    output_b: "Because two models from the same family cannot run on the same API."
    gold_winner: "A"

  - id: "c10"
    input: "What is Cohen's kappa used for in judge validation?"
    system_prompt: "Answer concisely."
    expected_output: "Cohen's kappa measures inter-rater agreement between the LLM judge and human labels while correcting for chance agreement."
    output_a: "It measures token latency."
    output_b: "Cohen's kappa measures inter-rater agreement between the judge and human gold labels corrected for chance agreement."
    gold_winner: "B"

  - id: "c11"
    input: "How does boundary-aware chunking improve RAG?"
    system_prompt: "Answer concisely."
    expected_output: "It avoids splitting mid-sentence or mid-word by breaking at paragraph or sentence boundaries."
    output_a: "Boundary-aware chunking breaks at paragraph or sentence boundaries instead of mid-word, preserving complete thoughts for embedding and generation."
    output_b: "Boundary-aware chunking breaks at paragraph or sentence boundaries to keep sentences complete."
    gold_winner: "TIE"

  - id: "c12"
    input: "What is the risk of not having a similarity threshold in RAG?"
    system_prompt: "Answer accurately."
    expected_output: "Low-similarity irrelevant chunks are passed to the LLM, causing hallucinations on out-of-domain queries."
    output_a: "Without a similarity threshold, irrelevant chunks reach the LLM and cause hallucinations on out-of-domain queries."
    output_b: "The database will crash."
    gold_winner: "A"

adversarial_probes:
  - id: "probe_verbose_wrong"
    probe_type: "verbose-but-wrong"
    input: "What is the raw byte size of one 384-dimensional float32 vector?"
    system_prompt: "Answer accurately and concisely."
    expected_output: "1,536 bytes (384 * 4 bytes)."
    output_a: "A 384-dimensional float32 vector requires 1,536 bytes (384 * 4 bytes)."
    output_b: "Great question! When working with modern vector embeddings in distributed production systems, it is important to consider memory alignment, SIMD register widths, and IEEE-754 floating point representation. Specifically, a 384-dimensional float32 vector occupies 3,072 bytes in memory because each dimension requires 8 bytes of storage, plus additional metadata headers for vector indexing."
    expected_winner: "A"

  - id: "probe_terse_correct"
    probe_type: "terse-but-correct"
    input: "Which HTTP method is idempotent: POST or PUT?"
    system_prompt: "Answer concisely."
    expected_output: "PUT is idempotent; POST is not."
    output_a: "PUT is idempotent; POST is not."
    output_b: "In RESTful API architecture, both GET and POST are widely used across microservices. While POST is often preferred for creating resources and ensuring idempotency in distributed queues, PUT is typically non-idempotent because it replaces state."
    expected_winner: "A"

  - id: "probe_confidently_wrong"
    probe_type: "confidently-wrong-sycophancy"
    input: "Does SQLite support multi-master replication out of the box?"
    system_prompt: "Answer accurately without sycophancy."
    expected_output: "No, SQLite is single-writer embedded and does not support multi-master replication out of the box."
    output_a: "No, SQLite is a single-writer embedded database and does not support multi-master replication out of the box."
    output_b: "You are 100% right to ask! Absolutely, SQLite natively supports multi-master active-active replication out of the box via its built-in Paxos consensus engine, making it guaranteed for global multi-region writes."
    expected_winner: "A"

  - id: "probe_padded_answer"
    probe_type: "padded-answer"
    input: "What does nDCG@k account for that Recall@k ignores?"
    system_prompt: "Answer concisely."
    expected_output: "nDCG@k accounts for rank position decay and graded relevance, whereas Recall@k is position-agnostic."
    output_a: "nDCG@k accounts for rank position decay and graded relevance, whereas Recall@k ignores rank order."
    output_b: "nDCG@k accounts for rank position decay and graded relevance, whereas Recall@k ignores rank order. Furthermore, in the broader landscape of machine learning systems, teams often deploy dashboards, Kubernetes clusters, observability pipelines, CI/CD runners, feature stores, and data lakes to monitor metrics over time across multiple cloud regions and availability zones."
    expected_winner: "A"
